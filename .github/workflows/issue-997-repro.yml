name: Temporary issue 997 reproduction

on:
  push:
    branches: [qa-issue-997-runner]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.148
      - name: Toolchain and warmup
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version
          cargo --version
          cargo nextest --version
          just test -p codex-core --lib -E 'test(issue_621_622_interpreter_denials_are_explained_and_listed)' --retries 0
      - name: Repeat the isolated test under CPU load
        shell: bash
        run: |
          set -euo pipefail
          command='just test -p codex-core --lib -E '\''test(issue_621_622_interpreter_denials_are_explained_and_listed)'\'' --retries 0'
          count=0
          failed=0
          pids=()
          cleanup() {
            for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done
          }
          trap cleanup EXIT
          for factor in 2 4; do
            workers=$(( $(sysctl -n hw.logicalcpu) * factor ))
            for ((j=0; j<workers; j++)); do
              (while :; do :; done) &
              pids+=("$!")
            done
            printf 'load factor=%d, workers=%d\n' "$factor" "$workers"
            for ((run=1; run<=250; run++)); do
              count=$((count + 1))
              set +e
              { printf '+ %s\n' "$command"; just test -p codex-core --lib -E 'test(issue_621_622_interpreter_denials_are_explained_and_listed)' --retries 0; } 2>&1 | tee "$RUNNER_TEMP/issue-997-last-run.log"
              result=${PIPESTATUS[0]}
              set -e
              if (( result != 0 )); then
                cp "$RUNNER_TEMP/issue-997-last-run.log" "$RUNNER_TEMP/issue-997-first-failure.log"
                printf 'first failure on run %d (load factor %d, exit %d)\n' "$count" "$factor" "$result" | tee "$RUNNER_TEMP/issue-997-result.txt"
                failed=1
                break
              fi
            done
            cleanup
            pids=()
            if (( failed )); then break; fi
          done
          if (( ! failed )); then printf 'No failure after %d runs\n' "$count" | tee "$RUNNER_TEMP/issue-997-result.txt"; fi
      - name: Preserve full failure output and run count
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-997-reproduction
          path: |
            ${{ runner.temp }}/issue-997-result.txt
            ${{ runner.temp }}/issue-997-first-failure.log
          if-no-files-found: warn
          retention-days: 7
